<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎮 متجر ألعاب وتطبيقات iPhone - MRMODS</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    /* Reset بسيط */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      direction: rtl;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #222;
      color: #fff;
      padding: 15px 20px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    nav {
      background: #007aff;
      padding: 10px 0;
      text-align: center;
      box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
    }
    nav button {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      margin: 0 15px;
      cursor: pointer;
      padding: 8px 15px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    nav button.active,
    nav button:hover {
      background-color: #005ecb;
    }
    /* إخفاء المحتوى في التصفح العادي */
    main {
      display: none;
      flex-grow: 1;
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px 50px;
      width: 100%;
    }
    /* إظهار المحتوى في وضع PWA */
    main.pwa-active {
      display: flex;
      flex-direction: column;
    }
    #searchBar {
      width: 100%;
      padding: 12px 15px;
      font-size: 18px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      margin-bottom: 25px;
      transition: border-color 0.3s;
    }
    #searchBar:focus {
      outline: none;
      border-color: #007aff;
      box-shadow: 0 0 5px #007aff;
    }
    .tab-content {
      display: none;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tab-content.active {
      display: flex;
    }
    .card {
      background: white;
      box-shadow: 0 2px 10px rgb(0 0 0 / 0.1);
      border-radius: 15px;
      width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgb(0 0 0 / 0.15);
    }
    .card img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      border-radius: 15px;
      margin-bottom: 15px;
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 12px;
      font-weight: 700;
      min-height: 52px;
    }
    .card a.download-btn {
      background-color: #007aff;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      width: 100%;
      display: inline-block;
      transition: background-color 0.3s;
    }
    .card a.download-btn:hover {
      background-color: #005ecb;
    }
    footer {
      background: #222;
      color: #aaa;
      text-align: center;
      padding: 20px 15px;
      font-size: 14px;
      margin-top: auto;
      user-select: none;
    }
    /* Responsive */
    @media (max-width: 768px) {
      .card {
        width: 45%;
      }
    }
    @media (max-width: 480px) {
      nav button {
        margin: 10px 8px;
        font-size: 16px;
        padding: 8px 12px;
      }
      .card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<header>🎮 متجر MRMODS للألعاب والتطبيقات</header>

<nav>
  <button class="tab-btn active" data-target="games">الألعاب</button>
  <button class="tab-btn" data-target="apps">التطبيقات</button>
</nav>

<main>
  <input type="search" id="searchBar" placeholder="ابحث عن لعبة أو تطبيق..." />

  <section id="games" class="tab-content active" aria-label="الألعاب">
    <article class="card" data-name="Last Day On Earth: Survival">
      <img src="https://m.media-amazon.com/images/I/71h4GRYcQWL.png" alt="Last Day On Earth: Survival" />
      <h2>Last Day On Earth: Survival</h2>
      <a href="https://filesharingbot-by-aj.onrender.com/dl/6868cb7cf5524635f472cc45" class="download-btn" target="_blank" rel="noopener noreferrer">تحميل اللعبة</a>
    </article>
    <!-- باقي المقالات هنا -->
  </section>

  <section id="apps" class="tab-content" aria-label="التطبيقات">
    <article class="card" data-name="YouTube Plus">
      <img src="https://ytliteplus.github.io/Logo.png" alt="YouTube Plus" />
      <h2>YouTube Plus [v20.16.7]</h2>
      <a href="https://filesharingbot-by-aj.onrender.com/dl/6868c816f5524635f472cc43" class="download-btn" target="_blank" rel="noopener noreferrer">تحميل التطبيق</a>
    </article>
    <!-- باقي المقالات هنا -->
  </section>
</main>

<footer>© 2025 MRMODS - جميع الحقوق محفوظة</footer>

<script>
  // تبويب التبديل بين الألعاب والتطبيقات
  const tabs = document.querySelectorAll('.tab-btn');
  const contents = document.querySelectorAll('.tab-content');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.target;
      contents.forEach(c => {
        c.id === target ? c.classList.add('active') : c.classList.remove('active');
      });
      document.getElementById('searchBar').value = '';
      filterItems('');
    });
  });

  const searchInput = document.getElementById('searchBar');
  searchInput.addEventListener('input', e => {
    filterItems(e.target.value);
  });

  function filterItems(searchTerm) {
    const activeContent = document.querySelector('.tab-content.active');
    const cards = activeContent.querySelectorAll('.card');
    const term = searchTerm.trim().toLowerCase();
    cards.forEach(card => {
      const name = card.dataset.name.toLowerCase();
      card.style.display = name.includes(term) ? 'flex' : 'none';
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isInStandaloneMode) {
      document.querySelector('main').classList.add('pwa-active');
    } else {
      alert("لتجربة أفضل، قم بتثبيت التطبيق على جهازك.");
    }
  });
</script>

</body>
</html>
